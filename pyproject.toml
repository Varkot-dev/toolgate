[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "caveat"
version = "0.1.0"
description = "An authorization gateway that checks every LLM agent tool call against a short-lived, narrowly scoped grant and an operator policy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varshith Kotagiri" }]
keywords = ["llm", "agents", "authorization", "capabilities", "mcp", "security", "audit-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = ["pyjwt[crypto]>=2.10", "cryptography>=42", "pyyaml>=6"]

[project.optional-dependencies]
verify = ["z3-solver>=4.13"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=2.3"]
llm = ["anthropic>=1"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "z3-solver>=4.13", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "mcp>=2.3"]

[project.urls]
Repository = "https://github.com/Varkot-dev/caveat"

[tool.hatch.build.targets.wheel]
packages = ["src/caveat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
