[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolgate"
version = "0.0.1"
description = "An authorization gateway for LLM agents"
requires-python = ">=3.11"
dependencies = ["pyjwt[crypto]>=2.10", "cryptography>=42", "pyyaml>=6"]

[project.optional-dependencies]
verify = ["z3-solver>=4.13"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "matplotlib>=3.8", "z3-solver>=4.13", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
