<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{csrf}}">
<title>toolgate dashboard</title>
<link rel="stylesheet" href="/dashboard/static/dashboard.css">
<script src="/dashboard/static/dashboard.js" defer></script>
</head>
<body>
<!-- Icons: Lucide (ISC license, see static/LICENSE-lucide.txt), inlined. -->
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
    <h1>toolgate <span>Gateway dashboard</span></h1>
  </div>
  <p class="status"><span id="live" class="live">Live</span><span class="every">refreshes every 2 s</span></p>
  <p class="me">
    <span class="avatar" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    <span>approving as <b>{{approver}}</b></span>
    <button id="logout" type="button" class="quiet">Sign out</button>
  </p>
</header>
<main class="grid">
  <section class="panel feed-panel">
    <div class="panel-head">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>
      <h2>Decision feed</h2>
      <small>newest first, as written to the audit log</small>
    </div>
    <div id="feed" class="scroll"><p class="empty">Loading...</p></div>
  </section>
  <section class="panel queue-panel">
    <div class="panel-head">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <h2>Approval queue</h2>
      <small>calls held for a person</small>
    </div>
    <p id="queue-notice" role="status"></p>
    <div id="queue" class="scroll"><p class="empty">Loading...</p></div>
  </section>
  <section class="panel chain-panel">
    <div class="chain-head">
      <div class="panel-head">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <h2>Audit chain</h2>
        <small>latest entries; each stores the previous entry's hash</small>
      </div>
      <div class="tools">
        <button id="verify" type="button" class="secondary">Verify the real log</button>
        <form id="tamper" autocomplete="off">
          <label>entry <input id="tamper-seq" type="number" min="0" step="1" value="0" required></label>
          <label>field <select id="tamper-field">{{field_options}}</select></label>
          <button type="submit" class="danger">Change this entry (demo copy)</button>
        </form>
      </div>
    </div>
    <div id="verify-result"></div>
    <div id="chain"><p class="empty">Loading...</p></div>
    <div id="tamper-result" class="tamper"></div>
  </section>
</main>
</body>
</html>
