<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--BASE-->
<link rel="stylesheet" href="system.css">
<style>
  .flow {
    position: relative; margin-top: 28px;
    display: grid; grid-template-columns: 184px 1fr 240px 1fr 184px;
    align-items: stretch;
  }
  .flow .card { z-index: 1; }
  .who { display: grid; gap: 2px; min-width: 0; }
  .rows { margin-top: 16px; display: grid; gap: 12px; }
  .lane { height: 62px; display: grid; align-content: start; gap: 6px; justify-items: start; }
  .lane .note { padding-left: 2px; line-height: 20px; white-space: nowrap; }
  .lane .note.mono { font-size: var(--size-body); }
  .stack { position: relative; display: grid; }
  .stack > * { grid-area: 1 / 1; }
  .pill .tool { color: var(--accent); }
  .pill.ok .tool, .pill.no .tool { color: inherit; }
  .card.gate { box-shadow: 0 0 0 1.5px #dcd7ff, var(--shadow); }
  .verdict .dot { width: 24px; height: 24px; }
  .pill.verdict { padding-left: 6px; font-weight: 700; }

  .log { margin-top: 48px; z-index: 1; padding-bottom: 20px; }
  .log .head .meta { color: var(--ok-ink); }
  .chain { margin-top: 16px; display: flex; align-items: center; }
  .link { width: 30px; display: grid; place-items: center; color: #a7a3c7; flex: none; }
  .link svg { width: 18px; height: 18px; stroke-width: 2.2; }
  .block {
    flex: 1 1 auto; background: var(--chip); border-radius: 14px; padding: 10px 14px;
    display: grid; gap: 4px;
  }
  .block .top { display: flex; align-items: center; gap: 6px; font-family: var(--mono); white-space: nowrap; line-height: 22px; }
  .block .hash { font-family: var(--mono); color: var(--muted); line-height: 20px; white-space: nowrap; }
  .block.ok { background: var(--ok-tint); }
  .block.no { background: var(--no-tint); }
  .block.ok .top { color: var(--ok-ink); }
  .block.no .top { color: var(--no-ink); }

  .packet {
    position: absolute; z-index: 3; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; background: var(--accent); border: 3px solid #fff;
    box-shadow: 0 0 0 4px rgba(91, 76, 240, 0.18), 0 4px 10px rgba(91, 76, 240, 0.35);
    opacity: 0;
  }
  .stop { position: absolute; z-index: 3; transform: translate(-50%, -50%); }
  .writes { position: absolute; z-index: 2; color: var(--muted); white-space: nowrap; line-height: 20px; }
  svg.wires { z-index: 2; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="flow" id="flow">
    <div class="card" id="agent">
      <div class="head"><div class="badge">{{icon:bot}}</div>
        <div class="who"><div class="name">Agent</div><div class="sub" id="agent-sub"></div></div></div>
      <div class="rows" id="agent-rows"></div>
    </div>
    <div></div>
    <div class="card gate" id="gate">
      <div class="head"><div class="badge solid">{{icon:shield-check}}</div>
        <div class="who"><div class="name">Gateway</div><div class="sub">token + policy</div></div></div>
      <div class="rows" id="gate-rows"></div>
    </div>
    <div></div>
    <div class="card" id="tools">
      <div class="head"><div class="badge plain">{{icon:wrench}}</div>
        <div class="who"><div class="name">Tools</div><div class="sub">file system</div></div></div>
      <div class="rows" id="tool-rows"></div>
    </div>
  </div>
  <div class="card log" id="log">
    <div class="head"><div class="badge">{{icon:scroll-text}}</div>
      <div class="who"><div class="name">Audit log</div><div class="sub">every decision, hash-chained</div></div>
      <div class="meta pill ok strong" id="verified"><span class="dot sm ok">{{icon:check}}</span><span>chain verifies</span></div>
    </div>
    <div class="chain" id="chain"></div>
  </div>
  <svg class="wires" id="wires"></svg>
  <div class="writes" id="writes">writes</div>
</div>
<template id="i-file-text">{{icon:file-text}}</template>
<template id="i-trash-2">{{icon:trash-2}}</template>
<template id="i-check">{{icon:check}}</template>
<template id="i-x">{{icon:x}}</template>
<template id="i-link">{{icon:link}}</template>
<script>
/*DATA*/
const D = window.DATA;
const T = D.timeline;
const $ = (id) => document.getElementById(id);
const ic = (n) => $("i-" + n).innerHTML;
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const NS = "http://www.w3.org/2000/svg";

// ---- timing helpers: everything is a pure function of t
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (u) => u * u * (3 - 2 * u);
const k = (t, a, b) => ease(clamp((t - a) / (b - a)));          // 0 -> 1 between a and b
// Exact resting values (no stray 0.99999 opacity), and motion only in whole
// device pixels, so a pose always rasterizes the same way.
const r3 = (x) => Math.round(x * 1000) / 1000;
const snap = (v) => Math.round(v * window.devicePixelRatio) / window.devicePixelRatio;
const rise = (u, d = 8) => { const y = snap(d * (1 - u)); return y === 0 ? "none" : `translateY(${y}px)`; };
let out = 1;                                                     // loop fade, set per frame

const A = {};  // animated parts, filled by init()

function rel(node) {
  const s = $("stage").getBoundingClientRect();
  const r = node.getBoundingClientRect();
  return { l: r.left - s.left, r: r.right - s.left, t: r.top - s.top, b: r.bottom - s.top,
           cx: (r.left + r.right) / 2 - s.left, cy: (r.top + r.bottom) / 2 - s.top };
}
function line(x0, y0, x1, y1, color, width, dash) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", `M ${x0} ${y0} L ${x1} ${y1}`);
  p.style.stroke = color;
  p.setAttribute("stroke-width", width || 3);
  if (dash) p.setAttribute("stroke-dasharray", dash);
  $("wires").append(p);
  return p;
}
function arrowhead(x, y, color, dir) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", dir === "down" ? `M ${x - 6} ${y - 7} L ${x} ${y} L ${x + 6} ${y - 7}`
                                     : `M ${x - 7} ${y - 6} L ${x} ${y} L ${x - 7} ${y + 6}`);
  p.style.stroke = color;
  p.setAttribute("stroke-width", 3);
  $("wires").append(p);
  return p;
}
// A wire that draws itself from its start: a dashed stroke whose dash is its length.
function drawn(x0, y0, x1, y1, color) {
  const p = line(x0, y0, x1, y1, color, 3);
  const len = Math.hypot(x1 - x0, y1 - y0);
  p.setAttribute("stroke-dasharray", `${len} ${len + 10}`);
  return { p, len, set(u, alpha) { p.setAttribute("stroke-dashoffset", r3(len * (1 - u))); p.style.opacity = r3(alpha); } };
}
function packet() {
  const d = el("div", "packet");
  $("stage").append(d);
  return d;
}
function place(node, x, y, alpha) {
  node.style.left = snap(x) + "px";
  node.style.top = snap(y) + "px";
  node.style.opacity = r3(alpha);
  node.hidden = alpha <= 0.001;
}

window.figure = {
  async init() {
    $("title").textContent = D.title;
    $("subtitle").textContent = D.subtitle;
    $("agent-sub").textContent = D.agent;
    D.calls.forEach((c, i) => {
      const a = el("div", "lane");
      a.append(el("span", "pill mono", `<span class="tool">${ic(c.icon)}</span><span>${esc(c.tool)}</span>`));
      a.append(el("span", "note mono muted", esc(c.target)));
      a.firstChild.id = `ask${i}`;
      $("agent-rows").append(a);

      const g = el("div", "lane");
      const v = el("span", `pill verdict strong ${c.ok ? "ok" : "no"}`,
        `<span class="dot sm ${c.ok ? "ok" : "no"}">${ic(c.ok ? "check" : "x")}</span><span>${esc(c.verdict)}</span>`);
      v.id = `verdict${i}`;
      g.append(v);
      const rule = el("span", "note mono muted", esc(c.rule));
      rule.id = `rule${i}`;
      g.append(rule);
      $("gate-rows").append(g);

      const t = el("div", "lane");
      const st = el("div", "stack");
      const idle = el("span", "pill mono", `<span class="tool">${ic(c.icon)}</span><span>${esc(c.tool)}</span>`);
      const ran = el("span", `pill mono ${c.ran ? "ok" : ""}`,
        `<span class="tool">${ic(c.ran ? "check" : c.icon)}</span><span>${esc(c.tool)}</span>`);
      idle.id = `idle${i}`; ran.id = `ran${i}`;
      st.append(idle, ran);
      t.append(st);
      const note = el("span", "note muted", esc(c.ran_text));
      note.id = `rannote${i}`;
      t.append(note);
      $("tool-rows").append(t);
    });
    D.audit.forEach((e, i) => {
      if (i > 0) { const l = el("div", "link", ic("link")); l.id = `link${i}`; $("chain").append(l); }
      const mark = e.kind === "token" ? "" : `<span class="dot sm ${e.kind}">${ic(e.kind === "ok" ? "check" : "x")}</span>`;
      const b = el("div", `block ${e.kind === "token" ? "" : e.kind}`,
        `<div class="top">${mark}<span>${esc(e.tool)}</span></div><div class="hash">#${e.seq} ${esc(e.hash)}</div>`);
      b.id = `block${i}`;
      $("chain").append(b);
    });

    // Wires, from the laid-out boxes.
    const agent = rel($("agent")), gate = rel($("gate")), tools = rel($("tools")), log = rel($("log"));
    A.calls = D.calls.map((c, i) => {
      const ask = rel($(`ask${i}`)), tool = rel($(`idle${i}`));
      const y = ask.cy;
      const x0 = agent.r + 10, x1 = gate.l - 10, x2 = gate.r + 10, x3 = tools.l - 10;
      const color = c.ok ? "var(--ok)" : "var(--no)";
      const inA = drawn(x0, y, x1, y, "var(--accent)");
      const inC = drawn(x0, y, x1, y, color);
      const headA = arrowhead(x1, y, "var(--accent)");
      const headC = c.ok ? arrowhead(x1, y, color) : null;
      const onward = c.ok ? drawn(x2, y, x3, y, color) : null;
      const onHead = c.ok ? arrowhead(x3, y, color) : null;
      let stop = null;
      if (!c.ok) {
        stop = el("span", "stop dot no", ic("x"));
        stop.style.left = x1 - 4 + "px"; stop.style.top = y + "px";
        $("stage").append(stop);
      }
      return { c, y, x0, x1, x2, x3, inA, inC, headA, headC, onward, onHead, stop, p: packet(), q: packet() };
    });
    const wx = gate.cx, wy0 = gate.b + 8, wy1 = log.t - 8;
    line(wx, wy0, wx, wy1, "var(--accent)", 2.5, "1 7");
    arrowhead(wx, wy1, "var(--accent)", "down");
    A.write = { x: wx, y0: wy0, y1: wy1, p: packet() };
    $("writes").style.left = wx + 14 + "px";
    $("writes").style.top = (wy0 + wy1) / 2 - 10 + "px";
  },

  frame(t) {
    if (t === null) t = T.poster;
    out = 1 - k(t, T.fade[0], T.fade[1]);
    let gateFocus = 0;
    A.calls.forEach((w, i) => {
      const s = T.calls[i];
      // the request leaves the agent
      const ask = $(`ask${i}`);
      const hi = k(t, s.start - 0.2, s.start) * (1 - k(t, s.verdict + 0.4, s.verdict + 0.8));
      ask.style.boxShadow = `0 0 0 ${2 * hi}px var(--accent)`;
      ask.style.background = hi > 0.01 ? "var(--accent-tint)" : "";
      const u = k(t, s.start, s.arrive);
      const decided = k(t, s.verdict - 0.05, s.verdict + 0.25);
      w.inA.set(u, out * (1 - decided));
      w.headA.style.opacity = r3(out * (u > 0.98 ? 1 : 0) * (1 - decided));
      w.inC.set(u, out * decided);
      if (w.headC) w.headC.style.opacity = r3(out * decided);
      const travelling = t >= s.start && t <= s.arrive + 0.15 ? 1 : 0;
      place(w.p, w.x0 + (w.x1 - w.x0) * u, w.y, out * travelling * (1 - k(t, s.arrive, s.arrive + 0.15)));
      gateFocus = Math.max(gateFocus, k(t, s.arrive - 0.15, s.arrive) * (1 - k(t, s.verdict + 0.3, s.verdict + 0.6)));

      // the gateway decides
      const v = $(`verdict${i}`), r = $(`rule${i}`);
      const vu = k(t, s.verdict, s.verdict + 0.3);
      v.style.opacity = r3(out * vu);
      v.style.transform = rise(vu);
      r.style.opacity = r3(out * k(t, s.verdict + 0.15, s.verdict + 0.45));
      if (w.stop) {
        const su = k(t, s.verdict, s.verdict + 0.3);
        w.stop.style.opacity = r3(out * su);
        w.stop.style.transform = su >= 1 ? "" : `translate(-50%, ${snap(-15 + 8 * (1 - su))}px)`;
      }

      // on to the tool, or not
      const ran = $(`ran${i}`), idle = $(`idle${i}`), note = $(`rannote${i}`);
      if (w.c.ok) {
        const o = k(t, s.onward, s.reach);
        w.onward.set(o, out);
        w.onHead.style.opacity = r3(out * (o > 0.98 ? 1 : 0));
        const moving = t >= s.onward && t <= s.reach + 0.15 ? 1 : 0;
        place(w.q, w.x2 + (w.x3 - w.x2) * o, w.y, out * moving * (1 - k(t, s.reach, s.reach + 0.15)));
        const done = k(t, s.reach, s.reach + 0.3);
        ran.style.opacity = r3(out * done);
        ran.style.transform = rise(done);
        note.style.opacity = r3(out * done);
      } else {
        ran.style.opacity = r3(0);
        note.style.opacity = r3(out * k(t, s.verdict + 0.3, s.verdict + 0.6));
      }
      idle.style.opacity = r3(1 - (w.c.ok ? 1 : 0) * out * k(t, s.reach || 0, (s.reach || 0) + 0.3));
    });
    $("gate").style.boxShadow = gateFocus > 0.01
      ? `0 0 0 1.5px #dcd7ff, 0 0 0 ${r3(5 * gateFocus)}px rgba(91, 76, 240, ${r3(0.22 * gateFocus)}), var(--shadow)` : "";

    // the decision goes to the log
    let wp = 0, wy = A.write.y0;
    D.audit.forEach((e, i) => {
      const b = $(`block${i}`), l = $(`link${i}`);
      const at = e.appears;
      if (at === null) return;
      const s = at - 0.35;
      if (t >= s && t <= at + 0.1) { wp = 1 - k(t, at, at + 0.1); wy = A.write.y0 + (A.write.y1 - A.write.y0) * k(t, s, at); }
      const u = k(t, at, at + 0.35) * out;
      b.style.opacity = r3(u);
      b.style.transform = rise(k(t, at, at + 0.35), 10);
      if (l) l.style.opacity = r3(u);
    });
    place(A.write.p, A.write.x, wy, wp * out);
    const vu = k(t, T.verified, T.verified + 0.35);
    $("verified").style.opacity = r3(out * vu);
    $("verified").style.transform = rise(vu);
  },

  problems() {
    const bad = [];
    for (const e of document.querySelectorAll(".card, .pill, .block, .lane")) {
      if (e.scrollWidth > e.clientWidth + 0.5) bad.push("overflow: " + e.textContent.trim());
    }
    for (const c of document.querySelectorAll(".flow .card, .log")) {
      const r = c.getBoundingClientRect();
      for (const p of c.querySelectorAll(".pill, .note, .block, .name, .sub")) {
        const q = p.getBoundingClientRect();
        if (q.right > r.right - 10 || q.bottom > r.bottom - 6) bad.push("outside card: " + p.textContent.trim());
      }
    }
    return bad;
  },
};
</script>
</body>
</html>
