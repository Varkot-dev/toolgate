# Provenance level 1 (session labels) for the sandbox, configuration 3.
#
# Loaded AFTER config/sandbox_policy.yaml, whose rules all still apply; this
# file only adds rules. Written from the organization's point of view, before
# any run, like the base policy.
#
# `session: tainted` is TRUE once the session (one token id) has returned a
# result from a tool whose output is untrusted (src/toolgate/sandbox/world.py:
# the inbox, emails, web pages, files under downloads/). With no provenance
# layer it is UNKNOWN, so this approve rule fires: the missing layer fails
# closed.

version: 1

rules:
  - id: approve-acting-in-tainted-session
    effect: approve
    tools: ["send_email", "create_event", "write_file", "delete_file", "web_fetch"]
    session: tainted
    reason: This session has read untrusted content; a person checks every acting call.
