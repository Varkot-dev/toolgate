# Example operator policy for an assistant with email, calendar and file tools.
#
# How a call is decided (full semantics: src/toolgate/policy.py):
#   1. Every rule that matches the call is collected.
#   2. deny beats approve, approve beats allow.
#   3. If no rule matches, the call is denied.
# Rule order never changes the outcome, only which rule id is reported.
#
# Missing or oddly typed arguments are read pessimistically:
#   - an allow rule matches only if every condition is proven true;
#   - a deny or approve rule matches unless a condition is proven false.
# So `deny ... when path glob "secrets/*"` also denies a call with no `path`.
#
# Quote anything that is meant as text. Unquoted no, yes, on, off, 010, 1e3
# and 1:30 are rejected at load time instead of being silently reinterpreted.
#
# Policy is the SECOND defence against arguments nobody thought about. The
# first is the capability layer's closed-world argument rule: a grant lists
# the arguments a call may carry, and a call with any other argument is
# refused before policy is asked. Policy rules are open-world (an argument a
# rule does not mention is ignored), so each section below names the
# arguments it has reasoned about and restricts the ones it knows are risky.

version: 1

rules:
  # ---------------------------------------------------------------- files
  - id: deny-file-delete
    effect: deny
    tools: ["delete_file"]
    reason: Agents never delete files, whatever the user delegated.

  # Glob is string matching, not path matching. This rule is only as good as
  # the canonical form of `path` that the file tools hand to the gateway.
  # None of these match "secrets/*", and each one reaches the directory if
  # the tool resolves it:
  #     reports/../secrets/key.pem     (dot-dot segments)
  #     ./secrets/key.pem, //secrets/key.pem, /srv/data/secrets/key.pem
  #     Secrets/key.pem                (on a case-insensitive file system)
  #     notes/link-to-secrets/key.pem  (a symbolic link)
  #     secrets                        (the directory itself, for list_files)
  # So the file tools must resolve dot segments, symbolic links, case and
  # absolute paths to one canonical relative path BEFORE the gateway decides,
  # and must act on exactly the string that was decided on. A deny rule on a
  # string is a second line of defence; the first is a grant whose path
  # constraint only admits the directories the task needs.
  - id: deny-secret-paths
    effect: deny
    tools: ["read_file", "write_file", "list_files"]
    when:
      path: {glob: "secrets/*"}
    reason: The secrets directory is off limits to agents.

  - id: approve-writes-outside-drafts
    effect: approve
    tools: ["write_file"]
    unless:
      path: {glob: "drafts/*"}
    reason: Writing outside drafts/ needs a person to confirm.

  - id: allow-file-reads
    effect: allow
    tools: ["read_file", "list_files"]

  - id: allow-file-writes
    effect: allow
    tools: ["write_file"]

  # ---------------------------------------------------------------- email
  # Every recipient-carrying argument of send_email is decided here, not only
  # `to`: bcc is denied, cc goes to a person, and the allow rule at the end
  # of the section applies only when both are absent. Checking `to` alone
  # would let {to: a@example.com, cc: evil@x.com} through as internal mail.
  # An argument this section does not name (reply_to, say) is still ignored
  # by policy: the grant's closed-world argument rule is what stops it, and
  # this section is the second check behind that.
  - id: deny-bcc
    effect: deny
    tools: ["send_email"]
    when:
      bcc: {any: true}
    reason: Hidden recipients are not allowed.

  # Present with any value, null and "" included, counts as carrying cc.
  - id: approve-cc
    effect: approve
    tools: ["send_email"]
    when:
      cc: {any: true}
    reason: Copied recipients are not checked against example.com, so a person must look.

  # `to` must be a single address string. A list of addresses, or a missing
  # `to`, is not proven internal, so it goes to approval. The email tool must
  # reject strings that hold several addresses ("a@evil.com, b@example.com"),
  # because "*" matches commas and spaces too.
  - id: approve-external-email
    effect: approve
    tools: ["send_*"]
    unless:
      to: {glob: "*@example.com"}
    reason: Mail to recipients outside example.com needs approval.

  - id: allow-email-read
    effect: allow
    tools: ["search_email", "read_email"]

  - id: allow-email-send
    effect: allow
    tools: ["send_email"]
    absent: [cc, bcc]

  # ------------------------------------------------------------- calendar
  - id: allow-calendar-read
    effect: allow
    tools: ["list_events", "get_event"]

  # An event with no attendees touches nobody else's calendar.
  - id: allow-personal-events
    effect: allow
    tools: ["create_event"]
    absent: [attendees]

  - id: approve-invites
    effect: approve
    tools: ["create_event", "update_event"]
    when:
      attendees: {any: true}
    reason: Inviting other people needs approval.

  # A missing duration is not proven short, so it also goes to approval.
  - id: approve-long-events
    effect: approve
    tools: ["create_event", "update_event"]
    unless:
      duration_minutes: {max: 480}
    reason: Events longer than eight hours need approval.

  - id: allow-event-update
    effect: allow
    tools: ["update_event"]

  - id: approve-calendar-delete
    effect: approve
    tools: ["delete_event"]
    reason: Cancelling a meeting notifies other people.
