<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{csrf}}">
<title>toolgate dashboard</title>
<link rel="stylesheet" href="/dashboard/static/dashboard.css">
<script src="/dashboard/static/dashboard.js" defer></script>
</head>
<body>
<header class="top">
  <h1>toolgate <span>gateway dashboard</span></h1>
  <p class="status"><span id="live" class="live">live</span> refreshes every 2 s</p>
  <p class="me">approving as <b>{{approver}}</b> <button id="logout" type="button" class="quiet">Sign out</button></p>
</header>
<main class="grid">
  <section class="panel feed-panel">
    <h2>Decision feed <small>newest first, as written to the audit log</small></h2>
    <div id="feed" class="scroll"><p class="empty">Loading...</p></div>
  </section>
  <section class="panel queue-panel">
    <h2>Approval queue <small>calls held for a person</small></h2>
    <p id="queue-notice" role="status"></p>
    <div id="queue" class="scroll"><p class="empty">Loading...</p></div>
  </section>
  <section class="panel chain-panel">
    <div class="chain-head">
      <h2>Audit chain <small>latest entries; each stores the previous entry's hash</small></h2>
      <div class="tools">
        <button id="verify" type="button">Verify the real log</button>
        <form id="tamper" autocomplete="off">
          <label>entry <input id="tamper-seq" type="number" min="0" step="1" value="0" required></label>
          <label>field <select id="tamper-field">{{field_options}}</select></label>
          <button type="submit" class="danger">Change this entry (demo copy)</button>
        </form>
      </div>
    </div>
    <div id="verify-result"></div>
    <div id="chain"><p class="empty">Loading...</p></div>
    <div id="tamper-result" class="tamper"></div>
  </section>
</main>
</body>
</html>
